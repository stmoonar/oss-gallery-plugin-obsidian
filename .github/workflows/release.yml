name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Install pnpm
              uses: pnpm/action-setup@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            # Also builds the semantic search runtime (dist/semantic-worker.js +
            # ONNX Runtime wasm/mjs) and regenerates their SHA-256 manifest
            # (src/semantic/assets.generated.ts) before main.js is bundled, so
            # the hashes in main.js always match the assets attached below.
            # THIRD_PARTY_NOTICES.txt (licenses of the bundled runtime) is
            # generated by the same build; it is not part of the hash manifest.
            - run: pnpm run build
            - name: Verify tag matches manifest version
              run: |
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
                      exit 1
                  fi
            - name: Check committed runtime manifest
              run: |
                  if ! git diff --exit-code -- src/semantic/assets.generated.ts; then
                      echo "::warning::src/semantic/assets.generated.ts differs from this build. The release is consistent (main.js uses the regenerated hashes), but commit the regenerated file so the source matches the release."
                  fi
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/styles.css
                      dist/manifest.json
                      dist/semantic-worker.js
                      dist/ort-wasm-simd-threaded.asyncify.wasm
                      dist/ort-wasm-simd-threaded.asyncify.mjs
                      dist/THIRD_PARTY_NOTICES.txt
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" dist/main.js dist/manifest.json dist/styles.css \
                      dist/semantic-worker.js \
                      dist/ort-wasm-simd-threaded.asyncify.wasm \
                      dist/ort-wasm-simd-threaded.asyncify.mjs \
                      dist/THIRD_PARTY_NOTICES.txt \
                      --title "$TAG" --generate-notes
